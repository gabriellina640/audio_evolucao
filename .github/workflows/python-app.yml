name: Build Complete EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Pegar o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # ou 3.13 se preferir

      # 3️⃣ Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 4️⃣ Baixar e preparar o FFmpeg
      - name: Download FFmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          # Criar pasta mesmo que já exista
          powershell -Command "New-Item -ItemType Directory -Force -Path ffmpeg"
          tar -xf ffmpeg.zip -C ffmpeg --strip-components=1
          echo "FFmpeg ready in ffmpeg/bin"

      # 5️⃣ Criar EXE com PyInstaller
      - name: Build EXE
        run: |
          pyinstaller --onefile ^
          --add-data "ffmpeg/bin;ffmpeg/bin" ^
          main.py

      # 6️⃣ Listar arquivos gerados (opcional)
      - name: List files
        run: dir dist

      # 7️⃣ Upload do EXE como artifact
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: audio_evolucao_exe
          path: dist/main.exe
