name: Build Complete EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3️⃣ Instalar dependências
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 4️⃣ Baixar e preparar o FFmpeg
      - name: Download FFmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          tar -xf ffmpeg.zip
          if (Test-Path ffmpeg) { Remove-Item -Recurse -Force ffmpeg }
          $folder = Get-ChildItem -Directory | Where-Object { $_.Name -like "ffmpeg-*" }
          Rename-Item -Path $folder.FullName -NewName ffmpeg

      # 5️⃣ Gerar o EXE com PyInstaller
      - name: Build EXE
        run: pyinstaller --onefile --add-data "ffmpeg/bin;ffmpeg/bin" main.py

      # 6️⃣ Subir o EXE como artifact
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: audio_evolucao_exe
          path: dist/main.exe
